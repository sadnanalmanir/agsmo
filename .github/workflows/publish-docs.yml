# 1) Contract-test progressive examples (SPARQL)
# 2) Build WIDOCO HTML docs
# 3) Deploy to GitHub Pages (only if tests pass)
#
# WIDOCO embeds LODE for term cross-reference sections.
name: Publish ontology documentation

on:
  push:
    branches: [main]
    paths:
      - "ontology/**"
      - "examples/**"
      - "shapes/**"
      - "docs/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "pytest.ini"
      - "widoco/**"
      - ".github/workflows/publish-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "ontology/**"
      - "examples/**"
      - "shapes/**"
      - "docs/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "pytest.ini"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  WIDOCO_VERSION: "v1.4.25"
  WIDOCO_JAR: "widoco-1.4.25-jar-with-dependencies_JDK-17.jar"

jobs:
  test:
    name: Example SPARQL contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run example contract tests
        run: pytest -q

  build:
    name: WIDOCO site
    needs: test
    # PRs only need tests; full site build/deploy on main + manual
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download WIDOCO
        run: |
          set -euo pipefail
          curl -fsSL -o widoco.jar \
            "https://github.com/dgarijo/Widoco/releases/download/${WIDOCO_VERSION}/${WIDOCO_JAR}"
          ls -la widoco.jar

      - name: Generate documentation with WIDOCO
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site

          java -jar widoco.jar \
            -ontFile ontology/agsmo.ttl \
            -outFolder site \
            -getOntologyMetadata \
            -webVowl \
            -rewriteAll \
            -uniteSections \
            -lang en \
            -includeAnnotationProperties \
            -noPlaceHolderText

          if [[ -f site/index-en.html && ! -f site/index.html ]]; then
            cp site/index-en.html site/index.html
          fi

          mkdir -p site/ontology site/examples site/tutorial
          cp ontology/agsmo.ttl site/ontology/agsmo.ttl
          cp -R examples/. site/examples/
          # Human-readable progressive tutorial (not raw TTL)
          cp docs/tutorial.html site/tutorial/index.html

          if [[ ! -f site/index.html ]]; then
            echo "WIDOCO did not produce index.html; listing site:" >&2
            find site -type f | head -50
            exit 1
          fi

          # Banner on WIDOCO home: link to tutorial (best entry for newcomers)
          python3 scripts/inject_tutorial_banner.py

          ls -la site
          ls -la site/examples
          ls -la site/tutorial

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
