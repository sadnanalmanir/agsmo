<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t5 d5">
  <title id="t5">Lesson 05 — Failure and roll-up</title>
  <desc id="d5">Plan root failed after step0 success and step1 failure.</desc>
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e07a7a"/>
    </marker>
    <marker id="arrow5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b9fd4"/>
    </marker>
    <style>
      .box-fail { fill: #2a1a1a; stroke: #e07a7a; stroke-width: 2.5; rx: 8; }
      .box-ok { fill: #1a2332; stroke: #7dcea0; stroke-width: 2; rx: 8; }
      .box-bad { fill: #2a1a1a; stroke: #e07a7a; stroke-width: 2; rx: 8; }
      .title-fail { fill: #e07a7a; font: 700 12px system-ui, sans-serif; }
      .title-ok { fill: #7dcea0; font: 700 11px system-ui, sans-serif; }
      .body { fill: #e7ecf3; font: 600 12px system-ui, sans-serif; }
      .meta { fill: #9aa8bc; font: 11px system-ui, sans-serif; }
      .edge { stroke: #5b9fd4; stroke-width: 1.6; fill: none; marker-end: url(#arrow5b); }
      .edge-f { stroke: #e07a7a; stroke-width: 1.6; fill: none; marker-end: url(#arrow5); }
    </style>
  </defs>

  <rect class="box-fail" x="170" y="15" width="300" height="70"/>
  <text class="title-fail" x="320" y="40" text-anchor="middle">Goal (plan root) — FAILED</text>
  <text class="body" x="320" y="60" text-anchor="middle">Run integration suite on staging</text>
  <text class="meta" x="320" y="76" text-anchor="middle">rollup: no open steps left + one failed</text>

  <path class="edge" d="M 250 85 V 120"/>
  <path class="edge-f" d="M 390 85 V 120"/>

  <rect class="box-ok" x="80" y="125" width="200" height="70"/>
  <text class="title-ok" x="180" y="148" text-anchor="middle">SubGoal [0] completed</text>
  <text class="body" x="180" y="168" text-anchor="middle">Deploy staging</text>
  <text class="meta" x="180" y="184" text-anchor="middle">Outcome success = true</text>

  <rect class="box-bad" x="360" y="125" width="200" height="70"/>
  <text class="title-fail" x="460" y="148" text-anchor="middle">SubGoal [1] failed</text>
  <text class="body" x="460" y="168" text-anchor="middle">Run e2e tests</text>
  <text class="meta" x="460" y="184" text-anchor="middle">Outcome success = false</text>

  <path class="edge" d="M 180 195 V 225"/>
  <path class="edge-f" d="M 460 195 V 225"/>

  <rect class="box-ok" x="70" y="230" width="220" height="50"/>
  <text class="title-ok" x="180" y="252" text-anchor="middle">Action → Outcome ✓</text>
  <text class="meta" x="180" y="270" text-anchor="middle">Staging URL healthy</text>

  <rect class="box-bad" x="350" y="230" width="220" height="50"/>
  <text class="title-fail" x="460" y="252" text-anchor="middle">Action → Outcome ✗</text>
  <text class="meta" x="460" y="270" text-anchor="middle">3 tests failed in checkout</text>
</svg>
