<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-labelledby="t1 d1">
  <title id="t1">Lesson 01 — Minimal goal</title>
  <desc id="d1">Agent connected to one active Goal.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b9fd4"/>
    </marker>
    <style>
      .box { fill: #1a2332; stroke: #5b9fd4; stroke-width: 2; rx: 10; }
      .title { fill: #5b9fd4; font: 700 12px system-ui, sans-serif; }
      .body { fill: #e7ecf3; font: 600 14px system-ui, sans-serif; }
      .meta { fill: #9aa8bc; font: 12px system-ui, sans-serif; }
      .edge { stroke: #5b9fd4; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .lbl { fill: #9aa8bc; font: 11px system-ui, sans-serif; }
    </style>
  </defs>
  <rect class="box" x="40" y="55" width="160" height="90"/>
  <text class="title" x="120" y="80" text-anchor="middle">Agent</text>
  <text class="body" x="120" y="105" text-anchor="middle">Alice's assistant</text>
  <text class="meta" x="120" y="128" text-anchor="middle">research helper</text>

  <path class="edge" d="M 210 100 H 290"/>
  <text class="lbl" x="250" y="90" text-anchor="middle">pursues</text>

  <rect class="box" x="300" y="45" width="180" height="110"/>
  <text class="title" x="390" y="70" text-anchor="middle">Goal</text>
  <text class="body" x="390" y="98" text-anchor="middle">Write abstract</text>
  <text class="meta" x="390" y="122" text-anchor="middle">status: active</text>
</svg>
