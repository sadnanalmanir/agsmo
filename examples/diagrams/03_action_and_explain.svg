<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="t3 d3">
  <title id="t3">Lesson 03 — Action, outcome, explain</title>
  <desc id="d3">SubGoal achieved by Action with rationale and successful Outcome.</desc>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b9fd4"/>
    </marker>
    <style>
      .box { fill: #1a2332; stroke: #5b9fd4; stroke-width: 2; rx: 8; }
      .box-ok { fill: #1a2332; stroke: #7dcea0; stroke-width: 2; rx: 8; }
      .box-a { fill: #243044; stroke: #5b9fd4; stroke-width: 2; rx: 8; }
      .title { fill: #5b9fd4; font: 700 11px system-ui, sans-serif; }
      .title-ok { fill: #7dcea0; font: 700 11px system-ui, sans-serif; }
      .body { fill: #e7ecf3; font: 600 12px system-ui, sans-serif; }
      .meta { fill: #9aa8bc; font: 11px system-ui, sans-serif; }
      .edge { stroke: #5b9fd4; stroke-width: 1.8; fill: none; marker-end: url(#arrow3); }
      .lbl { fill: #9aa8bc; font: 11px system-ui, sans-serif; }
      .why { fill: #e8b86d; font: italic 11px system-ui, sans-serif; }
    </style>
  </defs>

  <rect class="box" x="200" y="15" width="220" height="65"/>
  <text class="title" x="310" y="38" text-anchor="middle">SubGoal [0]</text>
  <text class="body" x="310" y="58" text-anchor="middle">Write core memory API</text>
  <text class="meta" x="310" y="72" text-anchor="middle">status: completed</text>

  <path class="edge" d="M 310 80 V 115"/>
  <text class="lbl" x="330" y="105">achievedBy</text>

  <rect class="box-a" x="140" y="120" width="340" height="95"/>
  <text class="title" x="310" y="142" text-anchor="middle">Action (+ prov:Activity)</text>
  <text class="body" x="310" y="162" text-anchor="middle">Implemented create_plan / progress</text>
  <text class="why" x="310" y="182" text-anchor="middle">rationale: offline tests; keep API small…</text>
  <text class="meta" x="310" y="200" text-anchor="middle">performedBy → Agent</text>

  <path class="edge" d="M 310 215 V 245"/>
  <text class="lbl" x="330" y="235">hasOutcome</text>

  <rect class="box-ok" x="190" y="250" width="240" height="55"/>
  <text class="title-ok" x="310" y="272" text-anchor="middle">Outcome  success = true</text>
  <text class="body" x="310" y="292" text-anchor="middle">Unit tests green</text>
</svg>
